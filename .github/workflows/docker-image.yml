name: Parallel Matrix Docker Builds

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: ./browser
            tag: spectra-browser
          - context: ./rtmp-server
            tag: spectra-rtmp-server
          - context: ./agents
            tag: spectra-agent
          - context: ./tools/pentools
            tag: spectra-pentools
          - context: ./tools/cyberchef/CyberChef-server
            tag: spectra-cyberchef-server
          - context: ./tools/cyberchef/cyberchef-api-mcp-server
            tag: spectra-cyberchef-mcp

    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.USERNAME }}/${{ matrix.tag }}:latest
