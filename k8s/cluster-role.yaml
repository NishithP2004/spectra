apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: router-role
rules:
- apiGroups: [""]
  resources: ["namespaces", "secrets", "services", "pods"]
  verbs: ["create", "get", "list", "delete", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["create", "get", "list", "delete", "update", "patch"]
