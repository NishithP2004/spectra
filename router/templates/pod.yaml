apiVersion: v1
kind: Pod
metadata:
  name: session-pod-{{UID}}
  namespace: user-{{UID}}
  labels:
    app: spectra-session
spec:
  containers:
    - name: browser
      image: nishithp/spectra-browser
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 7900
        - containerPort: 8921
        - containerPort: 8922
      env:
        - name: ENABLE_RECORDING
          value: "true"
        - name: RTMP_URL
          value: rtmp://localhost:1935/stream/browser-session-recording

    - name: rtmp-server
      image: nishithp/spectra-rtmp-server
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 1935
        - containerPort: 8080
      volumeMounts:
        - name: spectra-credentials
          mountPath: /app/credentials.json
          subPath: credentials.json

    - name: agent
      image: nishithp/spectra-agent
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 8000
      env:
        - name: PORT
          value: "8000"
        - name: GOOGLE_GENAI_USE_VERTEXAI
          value: "FALSE"
        - name: SERVE_WEB_INTERFACE
          value: "true"
        - name: MCP_TOOLS_URL_BROWSER
          value: http://localhost:8921/sse
        - name: MCP_TOOLS_URL_PYAUTOGUI
          value: http://localhost:8922/sse
        - name: MCP_TOOLS_URL_PENTOOLS
          value: http://localhost:5001/sse
        - name: MCP_TOOLS_URL_CYBERCHEF
          value: http://localhost:3001/sse
      envFrom:
        - secretRef:
            name: spectra-env-secret

    - name: pentools
      image: nishithp/spectra-pentools
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 5000
        - containerPort: 5001

    - name: cyberchef-server
      image: nishithp/spectra-cyberchef-server
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 3000

    - name: cyberchef-mcp
      image: nishithp/spectra-cyberchef-mcp
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 3001
      env:
        - name: CYBERCHEF_API_URL
          value: http://localhost:3000/

  volumes:
    - name: spectra-credentials
      secret:
        secretName: spectra-secret