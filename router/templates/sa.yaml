apiVersion: v1
kind: ServiceAccount
metadata:
  name: router-sa
  namespace: user-{{UID}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cleanup-job-binding-{{UID}}
  ownerReferences:
    - apiVersion: v1
      kind: Namespace
      name: user-{{UID}}
      uid: {{NAMESPACE_UID}}
      blockOwnerDeletion: true
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: router-role
subjects:
- kind: ServiceAccount
  name: router-sa
  namespace: user-{{UID}}
