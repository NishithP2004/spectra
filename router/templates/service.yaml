apiVersion: v1
kind: Service
metadata:
  name: agent-service
  namespace: user-{{UID}}
spec:
  selector:
    app: spectra-session
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: browser-service
  namespace: user-{{UID}}
spec:
  selector:
    app: spectra-session
  ports:
    - protocol: TCP
      port: 7900
      targetPort: 7900